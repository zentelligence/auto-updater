[package]
name = "updater-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints.rust]
unsafe_code = "forbid"

[[bin]]
name = "updater"
path = "src/main.rs"

[dependencies]
updater-core = { path = "../updater-core" }
updater-launcher = { path = "../updater-launcher" }
updater-engine = { path = "../updater-engine" }
clap = { version = "4.6.7", features = ["derive"] }
thiserror = "2.0.20"

[dev-dependencies]
ed25519-dalek = "3.0.0"
tempfile = "3.27.0"
